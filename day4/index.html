 function checkTemp() {

      let temp = document.getElementById("temp").value;
      let result = document.getElementById("result");

      if(temp === ""){
        result.innerHTML = "Please enter temperature";
      }
      else if(temp < 15){
        result.innerHTML = "Cold Weather";
      }
      else if(temp >= 15 && temp <= 30){
        result.innerHTML = " Normal Weather";

      let balance = 10000;

    function withdrawMoney(){

      let amount = Number(document.getElementById("amount").value);
      let result = document.getElementById("result");

      if(amount === 0){
        result.innerHTML = "Enter withdrawal amount";
      }

      else if(amount % 100 !== 0){
        result.innerHTML = "Amount must be multiple of 100";
      }

      else if(amount > balance){
        result.innerHTML = "Insufficient Balance";
      }

      else{
        balance = balance - amount;

        result.innerHTML =
          " Withdrawal Successful <br>" +
          "Remaining Balance: ₹" + balance;
      }

    }

    function calculateBonus(){

      let salary = Number(document.getElementById("salary").value);

      let result = document.getElementById("result");

      let bonus = 0;

      if(salary < 20000){
        bonus = salary * 0.10;
      }

      else if(salary <= 50000){
        bonus = salary * 0.15;
      }

      else{
        bonus = salary * 0.20;
      }

      let finalSalary = salary + bonus;

      result.innerHTML =
        "Bonus: ₹" + bonus + "<br>" +
        "Final Salary: ₹" + finalSalary;

    }
